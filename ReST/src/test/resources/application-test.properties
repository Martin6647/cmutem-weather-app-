# Configuración de Pruebas - REST API CMUTEM
# Este archivo se carga automáticamente con @SpringBootTest para ambiente de pruebas

# Información de la Aplicación
spring.application.name=cmutem-test
server.servlet.context-path=/cmutem

# Codificación
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# ============================================================
# Base de Datos de Prueba (H2 en memoria para tests rápidos)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console para debugging (opcional)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ============================================================
# JPA/Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.cl.sebastian.cm.rest=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# Configuración de Pruebas
# ============================================================

# Distancia máxima para búsquedas geoespaciales (metros)
max.distance=15000

# Timeout para operaciones de API (milisegundos)
api.timeout=5000

# Configuración de Google Auth (mocked en pruebas)
google.auth.enabled=false
google.client.id=test-client-id
google.client.secret=test-client-secret

# ============================================================
# Seguridad
# ============================================================
spring.security.filter.order=5

# ============================================================
# Jackson (serialización JSON)
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-timezone=UTC

# ============================================================
# Actuator (para monitoreo)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.enable.jvm=false
management.metrics.enable.process=false

# ============================================================
# Test Configuration Indicators
# ============================================================
app.environment=test
app.mock.external-apis=true
