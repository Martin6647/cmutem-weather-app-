# Configuración de Pruebas - Scheduler CMUTEM
# Este archivo se carga automáticamente con @SpringBootTest para ambiente de pruebas

# Información de la Aplicación
spring.application.name=scheduler-cmutem-test
server.servlet.context-path=/scheduler

# Codificación
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# ============================================================
# Base de Datos de Prueba (H2 en memoria para tests rápidos)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb-scheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA/Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.cl.sebastian.cm.scheduler=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.springframework.scheduling=DEBUG

# ============================================================
# Configuración de Tareas Programadas
# ============================================================

# Sincronización de datos meteorológicos
scheduler.meteo.enabled=false
scheduler.meteo.cron=0 0 * * * *
scheduler.meteo.fixed-delay=3600000
scheduler.meteo.initial-delay=60000

# Sincronización de farmacias de turno
scheduler.pharma.enabled=false
scheduler.pharma.cron=0 0 1 * * *
scheduler.pharma.fixed-delay=86400000
scheduler.pharma.initial-delay=120000

# ============================================================
# APIs Externas (Mocked en pruebas)
# ============================================================

# RedMeteo API
redmeteo.api.url=http://test.redmeteo.local
redmeteo.api.key=test-api-key
redmeteo.api.timeout=5000
redmeteo.api.enabled=false

# MINSAL API (Farmacias)
minsal.api.url=http://test.minsal.local
minsal.api.key=test-api-key
minsal.api.timeout=5000
minsal.api.enabled=false

# ============================================================
# Reintentos
# ============================================================
retry.max-attempts=3
retry.initial-delay=1000
retry.max-delay=5000
retry.backoff-multiplier=2

# ============================================================
# Jackson (serialización JSON)
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-timezone=UTC

# ============================================================
# Validación
# ============================================================
spring.validation.enabled=true

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.enable.jvm=false
management.metrics.enable.process=false

# ============================================================
# Thread Pool para Tareas Programadas
# ============================================================
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

# ============================================================
# Test Configuration Indicators
# ============================================================
app.environment=test
app.mock.external-apis=true
app.skip.initial-load=true
